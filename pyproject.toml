[project]
name = "marchive-preprocess"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.69",
    "easyocr>=1.7.2",
    "genai>=2.1.0",
    "google-genai>=2.18.1",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "pillow>=12.3.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# tests/ 가 app 을 임포트할 수 있게 프로젝트 루트를 sys.path 에 넣는다.
pythonpath = ["."]
testpaths = ["tests"]
